version: '3.8'

# Bright Mindz Academy - Staging / Test Server Docker Compose
# Designed for instant deployment to Linux VPS (Ubuntu/Debian) via IP address or test domain on HTTP port 80.
# No SSL certificates required for immediate smoke testing and client review.

services:
  db:
    image: postgres:16-alpine
    container_name: brightmindz_staging_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-brightmindz_staging_db}
      POSTGRES_USER: ${DB_USER:-brightmindz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-brightmindz_staging_secret}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - brightmindz_staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-brightmindz_user} -d ${DB_NAME:-brightmindz_staging_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: brightmindz_staging_backend
    restart: always
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-staging_django_secret_brightmindz_kochi_kerala_2026}
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-brightmindz_staging_db}
      DB_USER: ${DB_USER:-brightmindz_user}
      DB_PASSWORD: ${DB_PASSWORD:-brightmindz_staging_secret}
      DB_HOST: db
      DB_PORT: "5432"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_staging_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_staging_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-rzp_webhook_staging_secret}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mock}
      CLOUDFLARE_STREAM_ACCOUNT_ID: ${CLOUDFLARE_STREAM_ACCOUNT_ID:-}
      CLOUDFLARE_STREAM_API_TOKEN: ${CLOUDFLARE_STREAM_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER: ${WHATSAPP_PHONE_NUMBER:-919846000000}
    volumes:
      - media_staging:/app/media
      - static_staging:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brightmindz_staging_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: brightmindz_staging_frontend
    restart: always
    networks:
      - brightmindz_staging_net

  nginx:
    image: nginx:alpine
    container_name: brightmindz_staging_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - static_staging:/var/www/static:ro
      - media_staging:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - brightmindz_staging_net

volumes:
  postgres_staging_data:
  media_staging:
  static_staging:

networks:
  brightmindz_staging_net:
    driver: bridge
